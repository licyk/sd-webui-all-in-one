name: Build Mizuoto TTS WebUI ROCm

on:
  workflow_dispatch:

jobs:
  Build-Mizuoto-TTS-WebUI-ROCm:
    name: Build Mizuoto TTS WebUI ROCm
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup portable build
        uses: ./.github/actions/setup-portable-build

      - name: Launch Mizuoto TTS WebUI Installer
        env:
          SD_WEBUI_ALL_IN_ONE_SKIP_TORCH_DEVICE_COMPATIBILITY: 1
        shell: pwsh
        run: |
          & "${{ github.workspace }}/installer/mizuoto_tts_webui_installer.ps1" `
            -InstallPath "${{ github.workspace }}/mizuoto_tts_webui_rocm" `
            -PyTorchMirrorType rocm_win `
            -BuildMode `
            -BuildWithLaunch `
            -DisableAutoMirror `
            -DisablePyPIMirror `
            -DisableGithubMirror `
            -InstallHanafubuki `
            -DisableHuggingFaceMirror

      - name: Install FFmpeg
        shell: pwsh
        run: |
          & "${{ github.workspace }}/.github/install_ffmpeg.ps1" `
            -InstallPath "${{ github.workspace }}/mizuoto_tts_webui_rocm/git/bin"

      - name: Finalize portable package
        uses: ./.github/actions/finalize-portable
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN }}
        with:
          install-path: ${{ github.workspace }}/mizuoto_tts_webui_rocm
          software-name: mizuoto_tts_webui_rocm
          upload-path: ${{ github.workspace }}/sd-webui-all-in-one
          hf-repo-id: licyk/sd-webui-all-in-one
          ms-repo-id: licyks/sd-webui-all-in-one
