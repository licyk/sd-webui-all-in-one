###############################
# SD WebUI All In One Aria2 Next 配置文件
#
# 基于 aria2.conf 改写, 适用于 aria2-next 3.x, 只使用 aria2-next 原生选项
#
# 参考: https://github.com/AnInsomniacy/aria2-next
#
###############################


################ RPC ################
# 启用 JSON-RPC 服务器.
enable-rpc=true
# 在 RPC 响应中添加值为 * 的 Access-Control-Allow-Origin 头字段.
rpc-allow-origin-all=true
# 在所有网络接口上监听传入的 JSON-RPC 请求.
rpc-listen-all=false


################ 文件系统 ################
# 每隔 SEC 秒保存一次断点续传进度到 --state-dir (对应 aria2 的 auto-save-interval).
state-save-interval=10
# 指定文件分配方法.
file-allocation=none
# 每隔 SEC 秒将错误/未完成的下载保存到 --save-session 选项指定的文件中.
save-session-interval=10
# aria2-next 不支持 disk-cache / no-file-allocation-limit, 由引擎自行管理.


################ 任务 ################
# 最大同时下载任务数
max-concurrent-downloads=16
# 每个服务器的最大连接数
max-connection-per-server=16
# 单个文件的最大分段数
split=32
# 继续下载部分下载的文件
continue=true
# 在计算并发活动下载数时排除仅做种的下载 (对应 aria2 的 bt-detach-seed-only)
detach-share-only=true
# 使用 --ca-certificate 选项中指定的证书验证对等方.
check-certificate=false
# 如果 aria2-next 从远程服务器收到 NUM 次"文件未找到"状态, 则强制下载失败.
max-file-not-found=10
# 设置尝试次数.
max-tries=0
# 设置重试之间等待的秒数.
retry-wait=10
# 设置建立连接的超时时间(秒).
connect-timeout=10
# 设置超时时间(秒).
timeout=10
# aria2-next 不会分割小于 2*SIZE 字节范围.
min-split-size=20M
# aria2-next 不支持 piece-length, 由引擎自动决定.
# 发送 Accept: deflate,  gzip 请求头.
http-accept-gzip=true
# 从远程服务器检索远程文件的时间戳, 如果可用, 则将其应用于本地文件.
remote-time=true
# 设置输出下载进度摘要的间隔(秒).设置为 0 将禁止输出.
summary-interval=0
# aria2-next 不支持 content-disposition-default-utf8, 由引擎自动处理文件名编码.



################ BT 任务 ################
# 启用本地对等点发现.
bt-enable-lpd=true
# aria2-next 不支持 bt-hash-check-seed / bt-save-metadata / bt-load-saved-metadata / bt-remove-unselected-file,
# 由引擎自行管理做种校验与元数据缓存.
# 指定每个种子的最大对等点数.
bt-max-peers=128
# 优先下载每个文件的第一块和最后一块 (对应 aria2 的 bt-prioritize-piece=head).
bt-first-last-piece-first=true
# 在不验证分块哈希的情况下做种先前下载的文件.
bt-seed-unverified=true
# aria2-next 不支持 bt-tracker-connect-timeout / bt-tracker-timeout, 使用引擎默认的 tracker 超时.
# 设置 DHT 网络的入口点 (对应 aria2 的 dht-entry-point 与 dht-entry-point6).
bt-dht-bootstrap-nodes=dht.transmissionbt.com:6881
# 启用 DHT 功能 (aria2-next 中同时包含 aria2 的 enable-dht6).
enable-dht=true
# 启用对等点交换扩展.
enable-peer-exchange=true
# aria2-next 不支持 peer-agent / peer-id-prefix, 使用引擎默认的客户端标识.
